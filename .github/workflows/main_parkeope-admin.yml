name: Build and deploy Node.js app to Azure Web App - parkeope-admin

on:
  push:
    branches:
      - 'main'
    paths:
      - 'admin/**'
      - '.github/workflows/main_parkeope-admin.yml'
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - uses: actions/checkout@v4

      - name: Set up Node.js version
        uses: actions/setup-node@v4
        with:
          node-version: '24.x'
          cache: 'npm'
          cache-dependency-path: admin/package-lock.json

      - name: Install and build admin
        working-directory: ./admin
        env:
          VITE_API_URL: https://parkeope-d3etd0b0dwfwfjdb.chilecentral-01.azurewebsites.net
        run: |
          npm ci || npm install
          npm run build

      - name: Upload artifact for deployment job
        uses: actions/upload-artifact@v4
        with:
          name: node-app
          path: admin/dist

  deploy:
    runs-on: ubuntu-latest
    needs: build
    permissions:
      id-token: write
      contents: read

    steps:
      - name: Download artifact from build job
        uses: actions/download-artifact@v4
        with:
          name: node-app

      - name: Login to Azure
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZUREAPPSERVICE_CLIENTID_14625400D559481D97B0FFF2A89FCFDC }}
          tenant-id: ${{ secrets.AZUREAPPSERVICE_TENANTID_8A603FC4615A454BB4718D400DE87A44 }}
          subscription-id: ${{ secrets.AZUREAPPSERVICE_SUBSCRIPTIONID_6A1E4BD7BE2F4417BBB8346EC6AC9568 }}

      - name: 'Deploy to Azure Web App'
        id: deploy-to-webapp
        uses: azure/webapps-deploy@v3
        with:
          app-name: 'parkeope-admin'
          slot-name: 'Production'
          package: .
