name: Build and deploy Node.js app to Azure Web App - parkeope-client

on:
  push:
    branches:
      - 'main'
    paths:
      - 'client/**'
      - '.github/workflows/main_parkeope-client.yml'
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - uses: actions/checkout@v4

      - name: Set up Node.js version
        uses: actions/setup-node@v4
        with:
          node-version: '24.x'
          cache: 'npm'
          cache-dependency-path: client/package-lock.json

      - name: Install and build client
        working-directory: ./client
        env:
          VITE_API_URL: https://parkeope-d3etd0b0dwfwfjdb.chilecentral-01.azurewebsites.net
        run: |
          npm ci || npm install
          npm run build

      - name: Upload artifact for deployment job
        uses: actions/upload-artifact@v4
        with:
          name: node-app
          path: client/dist

  deploy:
    runs-on: ubuntu-latest
    needs: build
    permissions:
      id-token: write
      contents: read

    steps:
      - name: Download artifact from build job
        uses: actions/download-artifact@v4
        with:
          name: node-app

      - name: Login to Azure
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZUREAPPSERVICE_CLIENTID_BCCF7817A311491FA8B5B916D4173022 }}
          tenant-id: ${{ secrets.AZUREAPPSERVICE_TENANTID_B6DA09740AFC4E8FA3C00B7C40B75AD9 }}
          subscription-id: ${{ secrets.AZUREAPPSERVICE_SUBSCRIPTIONID_72D8EB1CFCEB455DA8572062DD2AB4E3 }}

      - name: 'Deploy to Azure Web App'
        id: deploy-to-webapp
        uses: azure/webapps-deploy@v3
        with:
          app-name: 'parkeope-client'
          slot-name: 'Production'
          package: .
